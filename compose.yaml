# The whole agent. Set it up and start it with ./setup (it asks for what's
# needed and writes .env); after that, `docker compose up -d` starts it.
#
# Secrets come from .env next to this file, and each service gets only the
# ones it needs. Nothing is published to the internet: the `tailscale` service
# serves the sites and the secrets page on your private Tailscale network.

x-harness: &harness           # settings shared by the harness services
  build: .
  image: neural-agent
  restart: unless-stopped
  environment: &harness-env
    TZ: ${TZ:-UTC}
  volumes:
    - harness-data:/app/data  # harness.db and friends. The runner never sees it.

services:
  # The agent. It gets the workspace and its own home, the Claude login, and
  # nothing else: no database, no Telegram token.
  runner:
    image: neural-agent
    restart: unless-stopped
    command: python -m harness.runner
    environment:
      RUNNER_HOST: 0.0.0.0
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      SITES_URL: ${SITES_URL:-http://127.0.0.1:8080}
      SECRETS_URL: ${SECRETS_URL:-http://127.0.0.1:8081}
      TZ: ${TZ:-UTC}
    volumes:
      - ./agent:/app/agent
      # Read-only: its permissions (settings.json) and skill scripts. Otherwise
      # the agent could allow itself anything, or rewrite an allowed script.
      - ./agent/.claude:/app/agent/.claude:ro
      - agent-home:/app/data/agent-home
      - workspace-git:/app/data/workspace.git     # the workspace's git history
      - agent-secrets:/run/agent-secrets:ro       # your keys, used through with-secrets
      - chat-history:/app/agent/history:ro        # the conversation log: it can read, not change

  worker:
    <<: *harness
    command: python -m harness.worker
    environment:
      <<: *harness-env
      RUNNER: runner:9000
      MCP_URL: http://mcp:8001/mcp
    volumes:
      - harness-data:/app/data  # also holds the GitHub app's key (data/github-app.json)
      - ./agent:/app/agent    # to read memory sizes after a dream
      - chat-history:/app/agent/history           # writes and backs up the conversation log
      - agent-secrets:/run/agent-secrets:ro       # to mask secrets in the log
      - workspace-git:/app/data/workspace.git:ro  # to commit-check and back up the history

  mcp:
    <<: *harness
    command: python -m harness.mcp_server
    environment:
      <<: *harness-env
      MCP_HOST: 0.0.0.0

  scheduler:
    <<: *harness
    command: python -m harness.scheduler

  telegram:
    <<: *harness
    command: python -m channels.telegram
    environment:
      <<: *harness-env
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - harness-data:/app/data
      - ./agent/uploads:/app/agent/uploads   # files you send go here, for the agent to read

  console:
    <<: *harness
    command: python -m channels.console

  sites:
    image: neural-agent
    restart: unless-stopped
    command: python -m web.sites
    environment:
      SITES_HOST: 0.0.0.0
      RUNNER: runner:9000   # site chats run in the runner, like everything the agent does
      TZ: ${TZ:-UTC}        # local times in the conversation log
    volumes:
      - ./agent/sites:/app/agent/sites:ro
      - chat-history:/app/agent/history           # site chats go in the conversation log
      - agent-secrets:/run/agent-secrets:ro       # to mask secrets in the log

  # The secrets page (see web/secrets_page.py): the only service that writes them.
  secrets:
    image: neural-agent
    restart: unless-stopped
    command: python -m web.secrets_page
    environment:
      SECRETS_HOST: 0.0.0.0
    volumes:
      - agent-secrets:/run/agent-secrets

  # Private access: this container joins your Tailscale network as its own
  # device ("agent") and serves the sites and the secrets page there, over
  # HTTPS. Nothing else can reach them. Its config: config/tailscale-serve.json.
  tailscale:
    image: tailscale/tailscale:latest
    restart: unless-stopped
    hostname: ${TS_HOSTNAME:-agent}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}           # only needed for the first login
      TS_HOSTNAME: ${TS_HOSTNAME:-agent}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"                  # no special privileges needed, desktop or server
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./config/tailscale-serve.json:/config/serve.json:ro

  # ./setup runs this: the questions, then .env. Not started by `up`.
  setup:
    <<: *harness
    profiles: [setup]
    restart: "no"
    user: root                    # it writes .env next to this file, and fixes folder owners
    entrypoint: ["python", "-m", "onboarding.wizard"]
    environment:
      <<: *harness-env
      SETUP_HOST: 0.0.0.0
      SETUP_PORT: ${SETUP_PORT:-8090}  # the port your browser uses (./setup picks a free one)
    ports:
      - 127.0.0.1:${SETUP_PORT:-8090}:8090   # the web version, and the GitHub step
    volumes:
      - harness-data:/app/data    # the GitHub app's key goes here
      - .:/project

volumes:
  harness-data:
  agent-home:
  workspace-git:
  agent-secrets:
  chat-history:
  tailscale-state:
